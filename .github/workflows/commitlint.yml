name: Commitlint

on:
  workflow_call:

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Lint PR commits
      uses: deepetherlabs/actions/commitlint@main
      with:
        from: ${{ github.event.pull_request.base.sha }}
        to: ${{ github.event.pull_request.head.sha }}
